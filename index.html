   <script>
const enter = document.getElementById("enter");
const audio = document.getElementById("music");
const player = document.getElementById("audio-player");

enter.addEventListener("click", () => {
    audio.play();

    player.classList.add("show");
    player.classList.add("playing");

    document.getElementById("audio-control").textContent = "❚❚";

    enter.style.display = "none";
});
</script>
<script>
const btn = document.getElementById("audio-control");

btn.addEventListener("click", () => {
    if (audio.paused) {
        audio.play();
        btn.textContent = "❚❚";
        player.classList.add("playing");
    } else {
        audio.pause();
        btn.textContent = "▶";
        player.classList.remove("playing");
    }
});
</script>

                        <script>
                            const userId = "418195027211059200";

                            const defaultGif = "./@nandiky_files/139b3b57a041f24fb792d94d022baa2c.gif";

                            async function updateDiscord() {
                                const el = document.getElementById("discord-status");
                                const img = document.getElementById("activity-image");

                                try {
                                    const response = await fetch(
                                        `https://api.lanyard.rest/v1/users/${userId}`
                                    );

                                    const result = await response.json();

                                    if (!result.success) {
                                        el.innerHTML = "Discord offline";
                                        img.src = defaultGif;
                                        return;
                                    }

                                    const data = result.data;

                                    let html = "";

                                    // SPOTIFY
                                    if (data.listening_to_spotify && data.spotify) {

                                        html += `🎵 ${data.spotify.song}<br>`;
                                        html += `<span style="opacity:.7">${data.spotify.artist}</span>`;

                                        // capa do spotify
                                        img.src = data.spotify.album_art_url;
                                    }

                                    // JOGO
                                    else {

                                        const activity = data.activities.find(a => a.type === 0);

                                        if (activity) {
                                            html += `🎮 ${activity.name}`;

                                            if (activity.assets && activity.assets.large_image) {
                                                let imageUrl = "";

                                                if (activity.assets.large_image.startsWith("mp:external")) {

                                                    imageUrl = `https://media.discordapp.net/${activity.assets.large_image.replace("mp:", "")}`;

                                                } else if (activity.assets.large_image.startsWith("spotify:")) {

                                                    imageUrl = `https://i.scdn.co/image/${activity.assets.large_image.replace("spotify:", "")}`;

                                                } else {

                                                    imageUrl = `https://cdn.discordapp.com/app-assets/${activity.application_id}/${activity.assets.large_image}.png?size=512`;
                                                }

                                                // fallback caso a imagem quebre
                                                img.onerror = () => {
                                                    img.src = defaultGif;
                                                };
                                                img.src = imageUrl + "&t=" + Date.now();
                                            } else {
                                                img.src = defaultGif;
                                            }
                                        } else {
                                            html += "Carregando...";
                                            img.src = defaultGif;
                                        }
                                    }

                                    el.innerHTML = html;

                                } catch (error) {

                                    console.log(error);

                                    el.innerHTML = "Carregando...";
                                    img.src = defaultGif;
                                }
                            }

                            updateDiscord();
                            setInterval(updateDiscord, 5000);
                        </script>
